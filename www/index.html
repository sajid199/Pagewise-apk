<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<style>
html{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Pagewise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap">
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<style>
/* Layout: full-screen e-reader. Paged text columns in the middle, a thin status line at the bottom, menus that slide in on a centre tap. */
:root {
  --bg: #F6F5F1;
  --fg: #1F1E1B;
  --muted: #77756E;
  --line: #DEDBD2;
  --accent: #2A5B84;
  --accent-fg: #FFFFFF;
  --sheet: #FFFFFF;
  --shadow: rgba(30, 28, 20, .16);
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101113; --fg: #CFCDC6; --muted: #8A8880; --line: #2A2B2E;
    --accent: #7FB2DB; --accent-fg: #0B1218; --sheet: #1A1B1E; --shadow: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101113; --fg: #CFCDC6; --muted: #8A8880; --line: #2A2B2E;
  --accent: #7FB2DB; --accent-fg: #0B1218; --sheet: #1A1B1E; --shadow: rgba(0,0,0,.5);
  color-scheme: dark;
}
/* Reader paper overrides (chosen inside the app) */
.app[data-paper="light"] { --bg: #F6F5F1; --fg: #1F1E1B; --muted: #77756E; --line: #DEDBD2; --accent: #2A5B84; --accent-fg: #fff; --sheet: #fff; --shadow: rgba(30,28,20,.16); }
.app[data-paper="sepia"] { --bg: #F0E4CB; --fg: #3A2E1E; --muted: #8A7757; --line: #DCCBA6; --accent: #8A4B22; --accent-fg: #fff; --sheet: #F7EEDA; --shadow: rgba(60,40,10,.2); }
.app[data-paper="dark"]  { --bg: #101113; --fg: #CFCDC6; --muted: #8A8880; --line: #2A2B2E; --accent: #7FB2DB; --accent-fg: #0B1218; --sheet: #1A1B1E; --shadow: rgba(0,0,0,.5); }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; display: flex; flex-direction: column; --fs: 20px; --lh: 1.6; --mx: 26px; --ff: var(--serif); }

/* Top bar */
.top { position: absolute; z-index: 6; inset: 0 0 auto 0; display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: var(--bg); border-bottom: 1px solid var(--line); transform: translateY(-101%); transition: transform .22s ease; }
.app.chrome .top { transform: none; }
.ttl { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.ib { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 12px; font-size: 14px; font-weight: 500; }
.ib:hover { background: var(--line); }
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ib.primary { background: var(--accent); color: var(--accent-fg); }
.ib.primary:hover { filter: brightness(1.08); background: var(--accent); }
@media (max-width: 440px) { .ib .lbl { display: none; } }

/* Stage */
.stage { position: relative; flex: 1; min-height: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.clip { position: absolute; left: var(--mx); right: var(--mx); top: 34px; bottom: 6px; overflow: hidden; }
.flow { position: relative; transition: transform .26s cubic-bezier(.2,.7,.2,1); will-change: transform; font-family: var(--ff); font-size: var(--fs); line-height: var(--lh); column-fill: auto; hyphens: auto; -webkit-hyphens: auto; font-optical-sizing: auto; }
.flow p { margin: 0; text-indent: 1.4em; text-align: justify; orphans: 2; widows: 2; }
.flow p.first, .flow h2 + p, .flow h3 + p { text-indent: 0; }
.flow h2 { margin: 0 0 .9em; font-size: 1.32em; line-height: 1.25; font-weight: 600; text-align: left; break-after: avoid; hyphens: manual; }
.flow h2.chapter { break-before: column; padding-top: 14%; font-size: 1.55em; }
.flow h3 { margin: 1.2em 0 .6em; font-size: 1.08em; font-weight: 600; text-align: left; break-after: avoid; }
.flow .kicker { font-family: var(--sans); font-size: .62em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.1em; text-indent: 0; text-align: left; }

.pgarea { position: absolute; inset: 34px 8px 6px 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pgarea canvas { display: block; max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 1px 10px var(--shadow); }
.pgarea canvas.in-r { animation: inr .24s ease both; }
.pgarea canvas.in-l { animation: inl .24s ease both; }
@keyframes inr { from { transform: translateX(14%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes inl { from { transform: translateX(-14%); opacity: 0; } to { transform: none; opacity: 1; } }
.app[data-eff="dark"] .pgarea canvas { filter: invert(.9) hue-rotate(180deg); box-shadow: none; }
.app[data-eff="sepia"] .pgarea canvas { filter: sepia(.35) saturate(.9) brightness(.97); }
.app:not([data-view="orig"]) .pgarea { display: none; }
.app[data-view="orig"] .clip { display: none; }

/* Status line */
.foot { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 30px; padding: 0 var(--mx); display: flex; align-items: center; justify-content: space-between; font-size: 12px; letter-spacing: .02em; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.foot .bk { flex: 1; min-width: 0; text-align: center; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Bottom bar */
.bottom { position: absolute; z-index: 6; inset: auto 0 0 0; padding: 12px 18px 14px; background: var(--bg); border-top: 1px solid var(--line); transform: translateY(101%); transition: transform .22s ease; display: flex; align-items: center; gap: 12px; }
.app.chrome .bottom { transform: none; }
.bottom .pos { font-size: 12px; color: var(--muted); min-width: 4.4em; font-variant-numeric: tabular-nums; }
.bottom .pos:last-child { text-align: right; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }

/* Aa sheet */
.sheet { position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 82%; overflow: auto; padding: 18px 18px 22px; background: var(--sheet); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px var(--shadow); transform: translateY(104%); transition: transform .25s ease; }
.sheet.open { transform: none; }
.sheet .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
.row { display: grid; gap: 8px; }
.row > .cap { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-width: 0; padding: 11px 6px; font-size: 14px; font-weight: 500; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.sizes { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; }
.sizes .sz { text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sizes button { height: 46px; border: 1px solid var(--line); border-radius: 12px; font-family: var(--serif); }
.sizes button:hover { background: var(--line); }
.papers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.papers button { border: 2px solid var(--line); border-radius: 12px; padding: 12px 4px 8px; font-size: 12px; display: grid; gap: 6px; justify-items: center; }
.papers button[aria-pressed="true"] { border-color: var(--accent); }
.papers i { display: block; width: 100%; height: 26px; border-radius: 6px; font-style: normal; font-family: var(--serif); font-size: 15px; line-height: 26px; text-align: center; border: 1px solid rgba(128,128,128,.3); }

/* Overlays */
.load { position: absolute; z-index: 20; inset: 0; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
.load .book { width: 54px; height: 40px; position: relative; perspective: 300px; }
.load .book b { position: absolute; top: 0; width: 27px; height: 40px; background: var(--fg); opacity: .15; border-radius: 2px; }
.load .book b:nth-child(1) { left: 0; }
.load .book b:nth-child(2) { right: 0; transform-origin: left center; background: var(--accent); opacity: .85; animation: flip 1.1s ease-in-out infinite; }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(-160deg); } 100% { transform: rotateY(0); } }
.load .t { font-family: var(--serif); font-size: 18px; max-width: 22em; overflow-wrap: anywhere; }
.load .s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.load .bar { width: min(280px, 70vw); height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.load .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
.drop { position: absolute; z-index: 19; inset: 10px; border: 2px dashed var(--accent); border-radius: 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-content: center; font-family: var(--serif); font-size: 22px; text-align: center; padding: 20px; }
.toast { position: absolute; z-index: 30; left: 50%; bottom: 64px; transform: translate(-50%, 12px); max-width: min(92%, 420px); background: var(--fg); color: var(--bg); font-size: 14px; padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .flow, .top, .bottom, .sheet { transition: none; } .pgarea canvas.in-r, .pgarea canvas.in-l, .load .book b { animation: none; } }
</style>

<div class="app" id="app" data-paper="auto" data-view="text" data-eff="light">
  <header class="top">
    <button class="ib primary" id="openBtn" type="button" aria-label="Open a PDF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg><span class="lbl">Open PDF</span>
    </button>
    <div class="ttl" id="ttl">Pagewise</div>
    <button class="ib" id="aaBtn" type="button" aria-label="Reading settings"><span style="font-family:var(--serif);font-size:19px;font-weight:600">Aa</span></button>
  </header>

  <div class="stage" id="stage">
    <div class="foot"><span id="fl"></span><span class="bk" id="fm"></span><span id="fr"></span></div>
    <div class="clip" id="clip"><div class="flow" id="flow" lang="en"></div></div>
    <div class="pgarea" id="pgarea"></div>
  </div>

  <div class="bottom">
    <span class="pos" id="bl">1</span>
    <input type="range" id="scrub" min="1" max="1" value="1" aria-label="Go to page">
    <span class="pos" id="br">1</span>
  </div>

  <section class="sheet" id="sheet" aria-label="Reading settings">
    <div class="wrap">
      <div class="row">
        <span class="cap">View</span>
        <div class="seg" id="sgView">
          <button type="button" data-v="text" aria-pressed="true">Reflowed text</button>
          <button type="button" data-v="orig" aria-pressed="false" id="origBtn">Original pages</button>
        </div>
      </div>
      <div class="row" id="rowText">
        <span class="cap">Text size</span>
        <div class="sizes">
          <button type="button" id="szDn" aria-label="Smaller text" style="font-size:15px">A</button>
          <div class="sz" id="szVal">20</div>
          <button type="button" id="szUp" aria-label="Larger text" style="font-size:25px">A</button>
        </div>
      </div>
      <div class="row" id="rowFont">
        <span class="cap">Typeface</span>
        <div class="seg" id="sgFont">
          <button type="button" data-v="serif" aria-pressed="true" style="font-family:var(--serif)">Literata</button>
          <button type="button" data-v="sans" aria-pressed="false" style="font-family:var(--sans)">DM Sans</button>
        </div>
      </div>
      <div class="row" id="rowSpace">
        <span class="cap">Line spacing</span>
        <div class="seg" id="sgLh">
          <button type="button" data-v="1.4" aria-pressed="false">Tight</button>
          <button type="button" data-v="1.6" aria-pressed="true">Normal</button>
          <button type="button" data-v="1.85" aria-pressed="false">Loose</button>
        </div>
      </div>
      <div class="row" id="rowMargin">
        <span class="cap">Margins</span>
        <div class="seg" id="sgMx">
          <button type="button" data-v="16" aria-pressed="false">Narrow</button>
          <button type="button" data-v="26" aria-pressed="true">Normal</button>
          <button type="button" data-v="42" aria-pressed="false">Wide</button>
        </div>
      </div>
      <div class="row">
        <span class="cap">Page colour</span>
        <div class="papers" id="papers">
          <button type="button" data-v="auto" aria-pressed="true"><i style="background:linear-gradient(90deg,#F6F5F1 50%,#101113 50%);color:#777">Aa</i>Auto</button>
          <button type="button" data-v="light" aria-pressed="false"><i style="background:#F6F5F1;color:#1F1E1B">Aa</i>White</button>
          <button type="button" data-v="sepia" aria-pressed="false"><i style="background:#F0E4CB;color:#3A2E1E">Aa</i>Sepia</button>
          <button type="button" data-v="dark" aria-pressed="false"><i style="background:#101113;color:#CFCDC6">Aa</i>Dark</button>
        </div>
      </div>
    </div>
  </section>

  <div class="drop" id="drop" hidden>Drop your PDF to start reading</div>
  <div class="load" id="load" hidden>
    <div class="book" aria-hidden="true"><b></b><b></b></div>
    <div class="t" id="loadT">Opening your book</div>
    <div class="bar"><i id="loadBar"></i></div>
    <div class="s" id="loadS"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var app = $('#app'), flow = $('#flow'), clip = $('#clip'), stage = $('#stage'), pgarea = $('#pgarea');
  var G = 40;

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var S = Object.assign({ fs: 20, lh: 1.6, mx: 26, ff: 'serif', paper: 'auto' }, lsGet('pagewise:settings') || {});

  var book = null, pdf = null, view = 'text';
  var page = 0, total = 1, step = 0, W = 0, H = 0, saveT = 0, renderToken = 0;

  /* ---------- Sample book (shown before a PDF is opened) ---------- */
  var SAMPLE = [
    ['k', 'A short guide'],
    ['c', 'Read the way you read a book'],
    ['p', 'Pagewise turns any PDF into pages that behave like a printed book. The text is lifted out of the file, set in a comfortable typeface and cut into pages that fit your screen exactly. Nothing scrolls. You turn.'],
    ['p', 'To turn forward, tap the right side of the screen or swipe left. To go back, tap the left edge or swipe right. A tap in the middle brings up the menu, where you can open a different PDF, change the text size, pick a page colour and drag along the bar to jump anywhere in the book.'],
    ['p', 'When you open your own PDF, this page is replaced by your book. Pagewise remembers where you stopped, so the next time you open the same file you land on the page you were reading.'],
    ['h', 'If a PDF looks wrong'],
    ['p', 'Books with a normal text layer reflow cleanly. Scanned books are different, because a scan is only a picture of each page. For those, Pagewise switches to the original pages and fits each one to your screen, so you can still turn through the book the same way.'],
    ['p', 'You can switch between the two views at any time from the Aa menu. Reflowed text is easier on small screens. Original pages keep pictures, tables and the exact layout of the printed edition.'],
    ['h', 'Making it comfortable'],
    ['p', 'Open the Aa menu to change the text size from small to very large, widen the margins, loosen the line spacing, or swap the typeface. Sepia is gentle in daylight. Dark is better in a dim room, and Auto follows your phone.'],
    ['p', 'Long books take a few seconds to prepare because every page has to be read and joined into continuous paragraphs. A progress bar shows how far along it is. Page numbers, running headers and hyphens at line ends are cleaned up along the way.'],
    ['p', 'Your PDF is read on this device. It is not uploaded anywhere.'],
    ['c', 'Ready when you are'],
    ['p', 'Choose Open PDF at the top of the screen, or drop a file anywhere on this page. Then lean back and turn the first page.'],
    ['p', 'Happy reading.']
  ];

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function sampleHtml() {
    var out = [], first = true;
    SAMPLE.forEach(function (b, i) {
      if (b[0] === 'k') out.push('<p class="kicker" data-i="' + i + '" data-p="1">' + esc(b[1]) + '</p>');
      else if (b[0] === 'c') { out.push('<h2' + (first ? '' : ' class="chapter"') + ' data-i="' + i + '" data-p="1">' + esc(b[1]) + '</h2>'); first = false; }
      else if (b[0] === 'h') out.push('<h3 data-i="' + i + '" data-p="1">' + esc(b[1]) + '</h3>');
      else out.push('<p data-i="' + i + '" data-p="1">' + esc(b[1]) + '</p>');
    });
    return out.join('');
  }

  /* ---------- Settings ---------- */
  function effectivePaper() {
    if (S.paper !== 'auto') return S.paper;
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return 'dark';
    if (t === 'light') return 'light';
    return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applySettings(relayout) {
    app.style.setProperty('--fs', S.fs + 'px');
    app.style.setProperty('--lh', S.lh);
    app.style.setProperty('--mx', S.mx + 'px');
    app.style.setProperty('--ff', S.ff === 'sans' ? 'var(--sans)' : 'var(--serif)');
    app.setAttribute('data-paper', S.paper);
    app.setAttribute('data-eff', effectivePaper());
    $('#szVal').textContent = S.fs;
    ['sgFont:ff', 'sgLh:lh', 'sgMx:mx', 'papers:paper'].forEach(function (p) {
      var a = p.split(':');
      document.querySelectorAll('#' + a[0] + ' button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.v) === String(S[a[1]]) ? 'true' : 'false');
      });
    });
    requestAnimationFrame(function () { document.body.style.background = getComputedStyle(app).backgroundColor; });
    lsSet('pagewise:settings', S);
    if (relayout) relayoutKeep();
  }

  /* ---------- Reflow layout ---------- */
  function anchorIndex() {
    var kids = flow.children, lim = page * step - 2, hit = null;
    for (var i = 0; i < kids.length; i++) { if (kids[i].offsetLeft >= lim) { hit = kids[i]; break; } }
    return hit;
  }
  function layout(anchorEl) {
    if (view !== 'text') return;
    W = clip.clientWidth; H = clip.clientHeight;
    if (W < 40 || H < 40) return;
    step = W + G;
    flow.style.width = W + 'px'; flow.style.height = H + 'px';
    flow.style.columnWidth = W + 'px'; flow.style.columnGap = G + 'px';
    total = Math.max(1, Math.round((flow.scrollWidth + G) / step));
    if (anchorEl) page = Math.min(total - 1, Math.max(0, Math.floor((anchorEl.offsetLeft + 2) / step)));
    page = Math.min(page, total - 1);
    flow.style.transition = 'none';
    flow.style.transform = 'translateX(' + (-page * step) + 'px)';
    void flow.offsetWidth;
    flow.style.transition = '';
    updateUI();
  }
  function relayoutKeep() {
    if (view !== 'text') { if (view === 'orig') showPdfPage(page + 1, 0); return; }
    var a = anchorIndex();
    layout(a);
  }

  /* ---------- Navigation ---------- */
  function go(d) {
    var np = page + d;
    if (np < 0 || np >= total) { toast(d > 0 ? 'You have reached the end' : 'This is the first page'); return; }
    setPage(np, d);
  }
  function setPage(np, d) {
    page = Math.max(0, Math.min(total - 1, np));
    if (view === 'text') flow.style.transform = 'translateX(' + (-page * step) + 'px)';
    else showPdfPage(page + 1, d || 0);
    updateUI(); scheduleSave();
  }
  function updateUI() {
    var pct = Math.round(((page + 1) / total) * 100);
    $('#fl').textContent = 'Page ' + (page + 1) + ' of ' + total;
    $('#fr').textContent = pct + '%';
    $('#bl').textContent = page + 1;
    $('#br').textContent = total;
    var sc = $('#scrub'); sc.max = total; sc.value = page + 1;
  }

  /* ---------- Original page view ---------- */
  function showPdfPage(n, dir) {
    if (!pdf) return;
    var token = ++renderToken;
    pdf.getPage(n).then(function (pg) {
      var vp0 = pg.getViewport({ scale: 1 });
      var aw = pgarea.clientWidth, ah = pgarea.clientHeight;
      var scale = Math.min(aw / vp0.width, ah / vp0.height);
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      var vp = pg.getViewport({ scale: scale * dpr });
      var cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.style.width = Math.floor(vp0.width * scale) + 'px';
      cv.style.height = Math.floor(vp0.height * scale) + 'px';
      return pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
        if (token !== renderToken) return;
        if (dir > 0) cv.className = 'in-r'; else if (dir < 0) cv.className = 'in-l';
        pgarea.innerHTML = ''; pgarea.appendChild(cv);
        pg.cleanup();
      });
    }).catch(function () { toast('Could not draw this page'); });
  }

  function setView(v, silent) {
    if (v === view) return;
    if (v === 'orig' && !pdf) { toast('Open a PDF to see its original pages'); return; }
    var mapPdfPage = 1;
    if (view === 'text') {
      var a = anchorIndex(); mapPdfPage = a ? parseInt(a.getAttribute('data-p') || '1', 10) : 1;
    } else mapPdfPage = page + 1;
    view = v;
    app.setAttribute('data-view', v);
    document.querySelectorAll('#sgView button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'); });
    ['rowText', 'rowFont', 'rowSpace', 'rowMargin'].forEach(function (id) { $('#' + id).style.display = v === 'orig' ? 'none' : ''; });
    if (v === 'orig') {
      total = pdf.numPages; page = Math.min(total - 1, mapPdfPage - 1);
      $('#fm').textContent = '';
      showPdfPage(page + 1, 0); updateUI();
    } else {
      page = 0;
      requestAnimationFrame(function () {
        var el = null, kids = flow.children;
        for (var i = 0; i < kids.length; i++) { if (parseInt(kids[i].getAttribute('data-p') || '1', 10) >= mapPdfPage) { el = kids[i]; break; } }
        layout(el);
      });
    }
    if (!silent) scheduleSave();
  }

  /* ---------- Save / restore ---------- */
  function scheduleSave() {
    if (!book || !book.key) return;
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var rec = { view: view, p: 1, i: 0 };
      if (view === 'orig') rec.p = page + 1;
      else { var a = anchorIndex(); if (a) { rec.i = parseInt(a.getAttribute('data-i') || '0', 10); rec.p = parseInt(a.getAttribute('data-p') || '1', 10); } }
      lsSet(book.key, rec);
    }, 500);
  }

  /* ---------- Text extraction ---------- */
  function median(a) { if (!a.length) return 0; var b = a.slice().sort(function (x, y) { return x - y; }); return b[Math.floor(b.length / 2)]; }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }
  var END = /[.!?…:;"”’')\]]\s*$/;

  async function extract(doc, onProg) {
    var n = doc.numPages, pages = [], hist = {};
    for (var i = 1; i <= n; i++) {
      var pg = await doc.getPage(i), tc = await pg.getTextContent(), lines = [], L = null;
      tc.items.forEach(function (it) {
        if (typeof it.str !== 'string') return;
        var y = it.transform[5], x = it.transform[4], h = Math.abs(it.height) || Math.abs(it.transform[3]) || 10;
        if (!L || Math.abs(y - L.y) > Math.max(h, L.size) * 0.55) {
          L = { y: y, x0: x, x1: x + (it.width || 0), size: h, text: '' };
          lines.push(L);
        }
        L.text += it.str;
        L.x0 = Math.min(L.x0, x); L.x1 = Math.max(L.x1, x + (it.width || 0));
        if (h > L.size) L.size = h;
      });
      lines = lines.map(function (l) { l.text = l.text.replace(/\s+/g, ' ').trim(); return l; }).filter(function (l) { return l.text; });
      lines.forEach(function (l) { var k = Math.round(l.size); hist[k] = (hist[k] || 0) + l.text.length; });
      pages.push(lines);
      pg.cleanup();
      onProg(i, n);
      if (i % 4 === 0) await tick();
    }
    var body = 10, best = 0;
    Object.keys(hist).forEach(function (k) { if (hist[k] > best) { best = hist[k]; body = +k; } });

    // Remove repeated running headers/footers and bare page numbers
    var freq = {}, norm = function (t) { return t.toLowerCase().replace(/\d+/g, '#').replace(/\s+/g, ' ').trim(); };
    pages.forEach(function (ls) { [ls[0], ls[ls.length - 1]].forEach(function (l) { if (l) { var k = norm(l.text); freq[k] = (freq[k] || 0) + 1; } }); });
    pages = pages.map(function (ls) {
      return ls.filter(function (l, idx) {
        var edge = idx === 0 || idx === ls.length - 1;
        if (!edge) return true;
        if (/^[\divxlcdm\-–— ]{1,8}$/i.test(l.text) && l.text.length < 8) return false;
        if (n > 6 && freq[norm(l.text)] > n * 0.4) return false;
        return true;
      });
    });

    var out = [], chars = 0;
    pages.forEach(function (ls, pi) {
      if (!ls.length) return;
      var gaps = []; for (var k = 1; k < ls.length; k++) { var g = ls[k - 1].y - ls[k].y; if (g > 0) gaps.push(g); }
      var med = median(gaps) || body * 1.3;
      var left = Infinity, right = 0;
      ls.forEach(function (l) { if (Math.abs(l.size - body) <= 1.5) { left = Math.min(left, l.x0); right = Math.max(right, l.x1); } });
      if (!isFinite(left)) { left = ls[0].x0; right = ls[0].x1; }
      var cur = null, firstOnPage = true;
      ls.forEach(function (l, k) {
        var prev = k ? ls[k - 1] : null, gap = prev ? prev.y - l.y : 0;
        var head = l.size > body * 1.25 && l.text.length < 90;
        if (head) {
          if (cur && cur.t === 'h' && gap <= med * 1.7) { cur.text += ' ' + l.text; cur.big = Math.max(cur.big, l.size / body); }
          else { cur = { t: 'h', text: l.text, p: pi + 1, big: l.size / body }; out.push(cur); }
          firstOnPage = false; return;
        }
        var endsSent = cur ? END.test(cur.text) : true;
        var short = prev ? prev.x1 < left + (right - left) * 0.8 : false;
        var indent = l.x0 > left + body * 0.9;
        var newP = !cur || cur.t === 'h' || gap > med * 1.5 || (indent && endsSent) || (short && endsSent);
        if (firstOnPage && cur && cur.t === 'p' && !END.test(cur.text) && /^[a-z]/.test(l.text)) newP = false;
        if (newP) { cur = { t: 'p', text: l.text, p: pi + 1 }; out.push(cur); }
        else if (/[A-Za-z]-$/.test(cur.text) && /^[a-z]/.test(l.text)) cur.text = cur.text.slice(0, -1) + l.text;
        else cur.text += ' ' + l.text;
        chars += l.text.length;
        firstOnPage = false;
      });
    });
    return { blocks: out, chars: chars, pages: n };
  }

  function blocksHtml(blocks) {
    var h = [], afterHead = false;
    blocks.forEach(function (b, i) {
      var a = ' data-i="' + i + '" data-p="' + b.p + '"';
      if (b.t === 'h') { h.push('<h2' + (b.big > 1.7 && i > 0 ? ' class="chapter"' : '') + a + '>' + esc(b.text) + '</h2>'); }
      else h.push('<p' + a + '>' + esc(b.text) + '</p>');
    });
    return h.join('');
  }

  /* ---------- Opening a file ---------- */
  function showLoad(title, sub, frac) {
    $('#load').hidden = false;
    $('#loadT').textContent = title; $('#loadS').textContent = sub || '';
    $('#loadBar').style.width = Math.round((frac || 0) * 100) + '%';
  }
  async function openFile(file) {
    if (!file) return;
    if (!/pdf$/i.test(file.name) && file.type !== 'application/pdf') { toast('Please choose a PDF file'); return; }
    if (typeof pdfjsLib === 'undefined') { toast('The PDF engine did not load. Check your connection and try again.'); return; }
    closeSheet();
    var name = file.name.replace(/\.pdf$/i, '');
    showLoad(name, 'Reading the file', 0.02);
    try {
      var buf = await file.arrayBuffer();
      var doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      var title = name;
      try { var md = await doc.getMetadata(); if (md && md.info && md.info.Title && md.info.Title.trim().length > 2) title = md.info.Title.trim(); } catch (e) {}
      var res = await extract(doc, function (i, n) { showLoad(title, 'Preparing page ' + i + ' of ' + n, 0.05 + 0.95 * i / n); });
      if (pdf && pdf !== doc) { try { pdf.destroy(); } catch (e) {} }
      pdf = doc;
      book = { title: title, key: 'pagewise:book:' + file.name + ':' + file.size };
      var scanned = res.chars < Math.max(200, res.pages * 40);
      flow.innerHTML = blocksHtml(res.blocks);
      $('#ttl').textContent = title; document.title = 'Pagewise';
      $('#fm').textContent = title.length > 40 ? title.slice(0, 38) + '…' : title;
      $('#origBtn').disabled = false;
      $('#load').hidden = true;
      var saved = lsGet(book.key);
      view = 'text'; app.setAttribute('data-view', 'text'); page = 0;
      document.querySelectorAll('#sgView button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === 'text' ? 'true' : 'false'); });
      ['rowText', 'rowFont', 'rowSpace', 'rowMargin'].forEach(function (id) { $('#' + id).style.display = ''; });
      app.classList.remove('chrome');
      await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      var el = null;
      if (saved && saved.view !== 'orig') el = flow.querySelector('[data-i="' + saved.i + '"]');
      layout(el);
      if (scanned) {
        toast('This looks like a scanned book, so it opens as original pages');
        setView('orig', true);
        if (saved && saved.view === 'orig') setPage(Math.min(pdf.numPages - 1, (saved.p || 1) - 1), 0);
      } else if (saved && saved.view === 'orig') {
        setView('orig', true); setPage(Math.min(pdf.numPages - 1, (saved.p || 1) - 1), 0);
      } else if (saved && el) {
        toast('Back to page ' + (page + 1));
      }
      scheduleSave();
    } catch (err) {
      $('#load').hidden = true;
      var msg = (err && err.name === 'PasswordException') ? 'This PDF is password protected. Remove the password and try again.'
        : (err && err.name === 'InvalidPDFException') ? 'This file is not a valid PDF.' : 'Could not open this PDF. Try another file.';
      toast(msg);
    }
  }

  /* ---------- UI wiring ---------- */
  var toastT;
  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2600); }
  function openSheet() { $('#sheet').classList.add('open'); app.classList.remove('chrome'); }
  function closeSheet() { $('#sheet').classList.remove('open'); }

  $('#openBtn').addEventListener('click', function () { $('#file').value = ''; $('#file').click(); });
  $('#file').addEventListener('change', function (e) { openFile(e.target.files[0]); });
  $('#aaBtn').addEventListener('click', openSheet);
  $('#scrub').addEventListener('input', function (e) { var v = +e.target.value; $('#fl').textContent = 'Page ' + v + ' of ' + total; $('#bl').textContent = v; });
  $('#scrub').addEventListener('change', function (e) { setPage(+e.target.value - 1, 0); });

  $('#sgView').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && !b.disabled) setView(b.dataset.v); });
  $('#sgFont').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.ff = b.dataset.v; applySettings(true); } });
  $('#sgLh').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.lh = +b.dataset.v; applySettings(true); } });
  $('#sgMx').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.mx = +b.dataset.v; applySettings(true); } });
  $('#papers').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.paper = b.dataset.v; applySettings(false); } });
  $('#szDn').addEventListener('click', function () { S.fs = Math.max(14, S.fs - 2); applySettings(true); });
  $('#szUp').addEventListener('click', function () { S.fs = Math.min(34, S.fs + 2); applySettings(true); });

  // Tap zones and swipe
  var sx = 0, sy = 0;
  stage.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
  stage.addEventListener('pointerup', function (e) {
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if ($('#sheet').classList.contains('open')) { closeSheet(); return; }
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) { app.classList.remove('chrome'); go(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      var r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
      if (app.classList.contains('chrome')) { app.classList.remove('chrome'); return; }
      if (x < 0.28) go(-1); else if (x > 0.72) go(1); else app.classList.add('chrome');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'range') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'Escape') { closeSheet(); app.classList.remove('chrome'); }
  });

  // Drag and drop
  var dragN = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragN++; $('#drop').hidden = false; });
  window.addEventListener('dragleave', function (e) { dragN = Math.max(0, dragN - 1); if (!dragN) $('#drop').hidden = true; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('#drop').hidden = true; var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) openFile(f); });

  if (window.ResizeObserver) { new ResizeObserver(function () { clearTimeout(window.__rz); window.__rz = setTimeout(relayoutKeep, 120); }).observe(stage); }
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applySettings(false); }); } catch (e) {} }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { relayoutKeep(); });
  new MutationObserver(function () { applySettings(false); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (window.pdfjsLib) { try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; } catch (e) {} }
  else $('#origBtn').disabled = true;

  /* ---------- Boot with the sample ---------- */
  book = { title: 'A short guide', key: null };
  flow.innerHTML = sampleHtml();
  $('#origBtn').disabled = true;
  $('#ttl').textContent = 'Pagewise';
  $('#fm').textContent = 'A short guide';
  applySettings(false);
  app.classList.add('chrome');
  requestAnimationFrame(function () { requestAnimationFrame(function () { layout(null); }); });
})();
</script>
